[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rna-therapeutics-monitor"
version = "0.1.0"
description = "Static, auditable monitoring of RNA therapeutics developments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "RNA Therapeutics Monitor contributors" }]
dependencies = [
  "feedparser==6.0.12",
  "httpx==0.28.1",
  "pydantic==2.12.5",
  "PyYAML==6.0.3",
  "tenacity==9.1.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pip-tools==7.5.2",
  "pytest==9.0.2",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.15.1",
  "types-PyYAML==6.0.12.20250915",
]

[project.scripts]
rna-monitor = "rna_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rna_monitor = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
packages = ["rna_monitor"]
mypy_path = "src"

