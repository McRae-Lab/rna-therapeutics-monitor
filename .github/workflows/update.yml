name: Update data

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: Initial lookback when a source has no prior state
        required: false
        default: "14"
        type: choice
        options:
          - "7"
          - "14"
          - "30"

permissions:
  contents: write

concurrency:
  group: rna-monitor-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out default branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configure Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Restore HTTP and enrichment caches
        uses: actions/cache@v5
        with:
          path: |
            .cache/http
            .cache/enrichment
          key: rna-monitor-${{ runner.os }}-${{ hashFiles('requirements.lock', 'config/*.yml') }}-${{ github.run_id }}
          restore-keys: |
            rna-monitor-${{ runner.os }}-${{ hashFiles('requirements.lock', 'config/*.yml') }}-
            rna-monitor-${{ runner.os }}-

      - name: Install locked dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --no-deps -e .

      - name: Run incremental no-key update
        env:
          RNA_MONITOR_CONTACT_EMAIL: ${{ vars.RNA_MONITOR_CONTACT_EMAIL || 'maintainer@example.invalid' }}
        run: python -m rna_monitor update --days "${{ inputs.days || '14' }}" --no-llm

      - name: Validate targeted update behavior
        run: pytest tests/test_pipeline.py tests/test_export.py tests/test_dedup.py

      - name: Build and validate static website
        run: |
          python -m rna_monitor build
          python -m rna_monitor validate
          node --check site/assets/app.js
          node --check site/assets/methodology.js

      - name: Commit changed normalized and public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data/ site/data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: update RNA therapeutics monitor $(date -u +%F)"
          git push
